[package]
name = "eisenstein-quantize"
version = "0.1.0"
edition = "2021"
description = "Hexagonal (A₂/Eisenstein) lattice quantization — the natural grid for balanced ternary"
license = "MIT"
keywords = ["eisenstein", "quantization", "hexagonal", "ternary", "lattice"]
categories = ["mathematics", "science"]

[dependencies]
num-rational = "0.4"
num-traits = "0.2"

[dev-dependencies]
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
